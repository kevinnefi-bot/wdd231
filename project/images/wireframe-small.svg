    <text x="188" y="42" text-anchor="middle" fill="#AAAAAA" font-family="sans-serif" font-size="9">123 Fitness Way, Suite 400 • Open 24/7/365</text>
    <text x="188" y="58" text-anchor="middle" fill="#AAAAAA" font-family="sans-serif" font-size="9">contact@peakperformancegym.org • (555) 732-5496</text>

