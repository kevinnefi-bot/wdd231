    <text x="140" y="84" text-anchor="middle" fill="#FFFFFF" font-size="9">f</text>
    <circle cx="172" cy="80" r="10" fill="#333333" stroke="#666666" stroke-width="1" />
    <text x="172" y="84" text-anchor="middle" fill="#FFFFFF" font-size="9">ig</text>
    <circle cx="204" cy="80" r="10" fill="#333333" stroke="#666666" stroke-width="1" />
    <text x="204" y="84" text-anchor="middle" fill="#FFFFFF" font-size="9">yt</text>
    <circle cx="236" cy="80" r="10" fill="#333333" stroke="#666666" stroke-width="1" />
    <text x="236" y="84" text-anchor="middle" fill="#FFFFFF" font-size="9">in</text>

    <text x="188" y="106" text-anchor="middle" fill="#777777" font-family="sans-serif" font-size="8">© 2026 Peak Performance Gym • WDD 231 Individual Project</text>
