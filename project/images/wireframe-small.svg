<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1350" width="400" height="1350" aria-label="Peak Performance Gym Mobile Viewport Wireframe">
  <defs>
    <style>
      .wf-bg { fill: #FFFFFF; }
      .wf-card { fill: #FAFAFA; stroke: #333333; stroke-width: 1.5; }
      .wf-card-alt { fill: #F0F2F5; stroke: #333333; stroke-width: 1.5; }
      .wf-stroke { stroke: #333333; stroke-width: 1.5; fill: none; }
      .wf-stroke-thin { stroke: #666666; stroke-width: 1; fill: none; }
      .wf-text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #111111; }
      .wf-text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; fill: #222222; }
      .wf-text-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #444444; }
      .wf-text-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #777777; }
      .wf-btn-primary { fill: #222222; }
      .wf-btn-text-light { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; fill: #FFFFFF; font-size: 11px; text-anchor: middle; }
      .wf-btn-secondary { fill: #FFFFFF; stroke: #333333; stroke-width: 1.5; }
      .wf-btn-text-dark { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; fill: #222222; font-size: 11px; text-anchor: middle; }
      .wf-img-box { fill: #EBEBEB; stroke: #333333; stroke-width: 1.5; }
      .wf-img-cross { stroke: #AAAAAA; stroke-width: 1.2; stroke-dasharray: 4 3; }
    </style>
  </defs>

  <!-- Phone Container / Screen Outline -->
