    <rect x="0" y="26" width="170" height="54" rx="6" class="wf-card" />
    <circle cx="24" cy="53" r="12" fill="#E0E0E0" stroke="#555555" stroke-width="1" />
    <text x="24" y="57" text-anchor="middle" font-size="11">⏱</text>
    <text x="44" y="47" class="wf-text-bold" font-size="10">24/7 Access</text>
    <text x="44" y="60" class="wf-text-muted" font-size="8.5">Keyless smart entry</text>

    <rect x="182" y="26" width="170" height="54" rx="6" class="wf-card" />
    <circle cx="206" cy="53" r="12" fill="#E0E0E0" stroke="#555555" stroke-width="1" />
